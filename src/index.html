<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Canvas + Chat (independent, project-aware)</title>
  <link rel="stylesheet" href="./dist/excalidraw.css" />
  <link rel="stylesheet" href="./chat/chat.css" />
  <link rel="stylesheet" href="./ast-view/ast-view.css" />
</head>
<body>
  <div id="toolbar" class="toolbar"></div>
  <div id="app">
    <div id="canvas-root"></div>
    <div id="ast-root"></div>
    <div id="chat-root"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    window.__MODE__ = params.get('mode') || 'full';
    window.__SCENARIO__ = params.get('scenario') || 'none';
  </script>
  <script type="module" src="./dist/renderer.bundle.js"></script>
</body>
</html>
